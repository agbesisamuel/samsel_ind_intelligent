# Local S3-only boundary. No credentials, application routes or control-port proxy.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    # nginx initializes these directories even though no FastCGI/uWSGI/SCGI routes exist.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker DNS is resolved per request so backend recreation cannot leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8333;
        client_max_body_size 16m;
        location / {
            set $storage_backend object-store-backend:8333;
            proxy_pass http://$storage_backend;
            # Preserve the signed Host and URI; never log authorization or request bodies.
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
