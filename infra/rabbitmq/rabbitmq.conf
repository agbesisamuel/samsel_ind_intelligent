# Synthetic local MQTT only. Plain MQTT is disabled; application AMQP stays on the private network.
mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous = false
mqtt.vhost = telemetry
mqtt.exchange = amq.topic
mqtt.max_packet_size_authenticated = 65536
mqtt.max_packet_size_unauthenticated = 4096
ssl_options.cacertfile = /tls-public/ca.crt
ssl_options.certfile = /tls-private/rabbitmq/tls.crt
ssl_options.keyfile = /tls-private/rabbitmq/tls.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# Server-authenticated TLS plus per-gateway credentials/HMAC is used locally; no mTLS claim.
