[project]
name = "samsel-industrial-intelligence-api"
version = "0.1.0"
description = "Local identity, tenant administration and audit API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2.18,<5.3", "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1", "psycopg[binary]>=3.2,<4",
  "celery>=5.5,<6", "redis>=6,<8", "gunicorn>=23,<25",
  "pyotp>=2.10,<3", "cryptography>=50.0.2,<51",
  "paho-mqtt>=2.1,<3",
  "boto3==1.43.116",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "pip-tools>=7.5,<8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
# Explicit ownership keeps import ordering identical from root, API cwd and CI.
known-first-party = ["config", "sii"]
