components:
  schemas:
    Acceptance:
      type: object
      description: Read-only QA review result, including evidence snapshot hash and
        synthetic marker.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organisation:
          type: string
          format: uuid
          readOnly: true
        site:
          type: string
          format: uuid
          readOnly: true
        commissioning:
          type: string
          format: uuid
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
        evidence_hash:
          type: string
          readOnly: true
        synthetic:
          type: boolean
          readOnly: true
        evidence_snapshot:
          readOnly: true
        current:
          type: boolean
          readOnly: true
      required:
      - approved_at
      - approved_by
      - commissioning
      - current
      - evidence_hash
      - evidence_snapshot
      - id
      - organisation
      - site
      - synthetic
    Access:
      type: object
      description: Immutable support access evidence for owner review.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
        accessed_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
      required:
      - accessed_at
      - action
      - id
      - session
    ActionEnum:
      enum:
      - acknowledge
      - assign
      - investigate
      - corrective_action
      - qa_review
      - close
      - amend
      type: string
      description: |-
        * `acknowledge` - acknowledge
        * `assign` - assign
        * `investigate` - investigate
        * `corrective_action` - corrective_action
        * `qa_review` - qa_review
        * `close` - close
        * `amend` - amend
    Activation:
      type: object
      description: An effective boundary does not approve actual monitored-site go-live.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        approval:
          type: string
          format: uuid
          readOnly: true
        effective_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval
      - effective_at
      - id
    ActivationResult:
      type: object
      description: Explicit unmet gates for site activation; no boolean is represented
        as a safety decision.
      properties:
        blockers:
          type: array
          items:
            type: string
      required:
      - blockers
    AdapterStatus:
      type: object
      description: Explicit technical preparation state; software evidence cannot
        assert customer acceptance.
      properties:
        status:
          type: string
        live_enabled:
          type: boolean
        profile: {}
        sensors:
          type: integer
        unresolved_incidents:
          type: integer
        failed_notifications:
          type: integer
        sampled_at:
          type: string
          format: date-time
        operational: {}
      required:
      - failed_notifications
      - live_enabled
      - operational
      - profile
      - sampled_at
      - sensors
      - status
      - unresolved_incidents
    Approval:
      type: object
      description: Immutable approval evidence binds a version and test to current
        qualification/timing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: string
          format: uuid
          readOnly: true
        backtest:
          type: string
          format: uuid
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
        snapshot_hash:
          type: string
          readOnly: true
        synthetic:
          type: boolean
          readOnly: true
      required:
      - approved_at
      - approved_by
      - backtest
      - id
      - snapshot_hash
      - synthetic
      - version
    ApprovalInput:
      type: object
      description: QA chooses the exact reviewed simulation, not an arbitrary approval
        flag.
      properties:
        backtest:
          type: string
          format: uuid
      required:
      - backtest
    ArtifactArchive:
      type: object
      description: Bounded source references/hashes; existing downloads keep their
        original authorization.
      properties:
        reports:
          type: array
          items: {}
        commissioning:
          type: array
          items: {}
        pilot_reviews:
          type: array
          items: {}
        packs:
          type: array
          items: {}
        limited_to_latest:
          type: integer
      required:
      - commissioning
      - limited_to_latest
      - packs
      - pilot_reviews
      - reports
    AssetLifecycle:
      enum:
      - planned
      - commissioning
      - active
      - degraded
      - retired
      type: string
      description: |-
        * `planned` - Planned
        * `commissioning` - Commissioning
        * `active` - Active
        * `degraded` - Degraded
        * `retired` - Retired
    Attachment:
      type: object
      description: Immutable attachment metadata excludes private storage keys and
        encryption material.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        checksum:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        uploaded_by:
          type: string
          format: uuid
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checksum
      - id
      - label
      - size
      - uploaded_at
      - uploaded_by
    AttachmentInput:
      type: object
      description: Bound labels/revision and delegate content validation to the plain-text-only
        service.
      properties:
        file:
          type: string
          format: uri
        label:
          type: string
          maxLength: 120
          minLength: 3
        revision:
          type: integer
          minimum: 0
      required:
      - file
      - label
      - revision
    Attempt:
      type: object
      description: Sanitized provider outcomes preserve attempt number and time without
        raw exceptions.
      properties:
        number:
          type: integer
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        outcome:
          type: string
          readOnly: true
        error_code:
          type: string
          readOnly: true
      required:
      - error_code
      - number
      - occurred_at
      - outcome
    Audit:
      type: object
      description: Read-only timeline exposes identifiers and evidence hashes, never
        secret snapshots.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organisation:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        site:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        actor:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        subject:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        before_hash:
          type: string
          readOnly: true
        after_hash:
          type: string
          readOnly: true
        prev_hash:
          type: string
          readOnly: true
        event_hash:
          type: string
          readOnly: true
      required:
      - action
      - actor
      - after_hash
      - before_hash
      - event_hash
      - id
      - occurred_at
      - organisation
      - prev_hash
      - sequence
      - site
      - subject
    AuthResult:
      type: object
      description: Challenge state is not authentication; only complete grants a business
        session.
      properties:
        state:
          $ref: '#/components/schemas/AuthResultStateEnum'
        secret:
          type: string
        provisioning_uri:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - state
    AuthResultStateEnum:
      enum:
      - complete
      - mfa
      - enroll
      - accepted
      - signed_out
      type: string
      description: |-
        * `complete` - complete
        * `mfa` - mfa
        * `enroll` - enroll
        * `accepted` - accepted
        * `signed_out` - signed_out
    Backtest:
      type: object
      description: Preserved preview includes input hash, excluded count and deterministic
        transition times.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: string
