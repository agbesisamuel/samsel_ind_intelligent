openapi: 3.1.0
info:
  title: SAMSEL Industrial Intelligence — Foundation API
  version: 0.1.0
  description: Local identity and tenant administration. No monitoring or device control.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Return the masked token; the browser receives the matching CSRF
        cookie.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFResult'
          description: ''
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: Consume once under lock; existing identities must already be fully
        authenticated.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Throttle both IP and account; Django equalizes nonexistent-account
        password hashing.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: CSRF protects logout; unknown/revoked sessions can still be cleared
        safely.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/mfa/enroll/:
    post:
      operationId: auth_mfa_enroll_create
      description: Encrypt the seed and require a correct code before enabling MFA
        or login.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAInput'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: One-time recovery needs password proof and never bypasses factor
        replacement.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAInput'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Serialize token consumption with the user lock; never log in automatically.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: Send only through local SMTP asynchronously; rate-limit every submitted
        address.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/step-up/:
    post:
      operationId: auth_step_up_create
      description: Never accept a recovery code as direct step-up; recovery requires
        reenrollment.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAInput'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Return a fixed liveness response; does not imply monitoring is
        operational.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Client capabilities are hints; server queries always recalculate
        permissions.
      tags:
      - me
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/organisations/:
    get:
      operationId: organisations_list
      description: No staff bypass to tenant sites/data; explicit platform list contains
        only metadata.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganisationList'
          description: ''
    post:
      operationId: organisations_create
      description: Provision an organisation with a mailed owner invite after fresh
        platform MFA.
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProvisionInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProvisionInput'
        required: true
      security:
      - verifiedSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: ''
  /api/v1/organisations/{org_id}/:
    get:
      operationId: organisations_retrieve
      description: Return scoped metadata; foreign and nonexistent IDs have the same
        404.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: ''
    patch:
      operationId: organisations_partial_update
      description: Keep customer ownership fixed and audit the before/after configuration
        hashes.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganisation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganisation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganisation'
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: ''
  /api/v1/organisations/{org_id}/audit/:
    get:
      operationId: organisations_audit_list
      description: Global auth events are never included in customer timelines or
        staff browse APIs.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditList'
          description: ''
  /api/v1/organisations/{org_id}/invitations/:
    get:
      operationId: organisations_invitations_list
      description: Return only invitations the manager could manage within their current
        scope.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: organisations_invitations_create
      description: Authorize offered privileges before issuing the email proof, with
        recent MFA.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationInput'
        required: true
      security:
      - verifiedSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/organisations/{org_id}/invitations/{invitation_id}/revoke/:
    post:
      operationId: organisations_invitations_revoke_create
      description: Scope and lock the invitation before revoking it; accepted memberships
        are separate.
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/organisations/{org_id}/invoices/:
    get:
      operationId: organisations_invoices_list
      description: Scope precedes pagination and invoice reference disclosure.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
    post:
      operationId: organisations_invoices_create
      description: Preserve idempotent reference/content; never call an accounting/payment
        service.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
        required: true
      security:
      - verifiedSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/v1/organisations/{org_id}/invoices/{invoice_id}/export/:
    get:
      operationId: organisations_invoices_export_retrieve
      description: Recheck current commercial scope and audit before returning a formula-safe
        attachment.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/organisations/{org_id}/members/:
    get:
      operationId: organisations_members_list
      description: Return an empty list to nonmanagers, never another site's identity
        roster.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
  /api/v1/organisations/{org_id}/members/{membership_id}/:
    patch:
      operationId: organisations_members_partial_update
      description: Prevent last-owner removal; all subsequent requests recheck active
        membership.
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMembershipInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipInput'
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/organisations/{org_id}/roles/:
    post:
      operationId: organisations_roles_create
      description: Lock organisation edits; new privilege cannot bypass the next session
        assurance check.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleInput'
        required: true
      security:
      - verifiedSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/organisations/{org_id}/roles/{role_id}/revoke/:
    post:
      operationId: organisations_roles_revoke_create
      description: Retain at least one owner and forbid site-admin escalation through
        nested role IDs.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '204':
          description: No response body
  /api/v1/organisations/{org_id}/sites/:
    get:
      operationId: organisations_sites_list
      description: Scope before pagination so counts cannot reveal unrelated sites.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSiteList'
          description: ''
    post:
      operationId: organisations_sites_create
      description: Create planned-only sites; no request can activate real monitoring.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Site'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Site'
        required: true
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
  /api/v1/organisations/{org_id}/sites/{site_id}/:
    get:
      operationId: organisations_sites_retrieve
      description: Return an allowed site without broadening scope from a query/body
        override.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    patch:
      operationId: organisations_sites_partial_update
      description: Archive/configure without deleting historic references or modifying
        service state.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSite'
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
  /api/v1/organisations/{org_id}/sites/{site_id}/acceptances/:
    get:
      operationId: organisations_sites_acceptances_list
      description: Return paginated records only after exact scope resolution.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcceptanceList'
          description: ''
    post:
      operationId: organisations_sites_acceptances_create
      description: Sensitive writes lock the site; QA alone records calibration, managers
        record drafts.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Acceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Acceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Acceptance'
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acceptance'
          description: ''
  /api/v1/organisations/{org_id}/sites/{site_id}/acceptances/{object_id}/:
    get:
      operationId: organisations_sites_acceptances_retrieve
      description: Foreign inventory IDs return the same response as absent IDs.
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acceptance'
          description: ''
    patch:
      operationId: organisations_sites_acceptances_partial_update
      description: Evidence is append-only; hierarchy, external identity and lifecycle
        cannot be patched.
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcceptance'
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acceptance'
          description: ''
  /api/v1/organisations/{org_id}/sites/{site_id}/activation/:
    get:
      operationId: organisations_sites_activation_retrieve
      description: Return missing rule, route and real acceptance gates to an authorized
        site reader.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organisations
      security:
      - verifiedSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
