      - reason
      - state
    Ticket:
      type: object
      description: Preserved original content and current support state with server-owned
        provenance.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        reported_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SupportTicketState'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        synthetic:
          type: boolean
          readOnly: true
      required:
      - body
      - created_at
      - id
      - reported_by
      - request_id
      - revision
      - status
      - subject
      - synthetic
    TicketEvent:
      type: object
      description: Immutable chronological response/status evidence.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
        message:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SupportTicketState'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - message
      - status
    TicketInput:
      type: object
      description: Bounded request text/replay identity; no destination or tenant
        override is accepted.
      properties:
        request_id:
          type: string
          format: uuid
        subject:
          type: string
          maxLength: 160
          minLength: 3
        body:
          type: string
          maxLength: 2000
          minLength: 8
      required:
      - body
      - request_id
      - subject
    TicketNoteInput:
      type: object
      description: Bounded reply, current revision and explicit support state prevent
        lost updates.
      properties:
        revision:
          type: integer
          minimum: 0
        message:
          type: string
          maxLength: 2000
          minLength: 3
        status:
          $ref: '#/components/schemas/SupportTicketState'
      required:
      - message
      - revision
      - status
    TokenInput:
      type: object
      description: One-time proof plus password; secrets only travel in protected
        request bodies.
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 128
        password:
          type: string
          writeOnly: true
          maxLength: 256
      required:
      - password
      - token
    TransitionInput:
      type: object
      description: Request a lifecycle transition, not arbitrary model field writes.
      properties:
        target:
          $ref: '#/components/schemas/AssetLifecycle'
      required:
      - target
    UnitEnum:
      enum:
      - degC
      type: string
      description: '* `degC` - Celsius'
    Version:
      type: object
      description: Immutable version content with a derived lifecycle, never a mutable
        approved draft.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ruleset:
          type: string
          format: uuid
        version:
          type: integer
          readOnly: true
        lower_bound:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        upper_bound:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        hysteresis:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        sustained_sec:
          type: integer
          maximum: 2147483647
          minimum: 0
        recovery_sec:
          type: integer
          maximum: 2147483647
          minimum: 0
        sop_reference:
          type: string
          maxLength: 240
        created_at:
          type: string
          format: date-time
          readOnly: true
        stage:
          type: string
          readOnly: true
        latest_backtest:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        approval:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
      required:
      - approval
      - created_at
      - hysteresis
      - id
      - latest_backtest
      - lower_bound
      - recovery_sec
      - ruleset
      - sop_reference
      - stage
      - sustained_sec
      - upper_bound
      - version
    Zone:
      type: object
      description: Building UUID is resolved only within the URL site; categories
        imply no safe limits.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organisation:
          type: string
          format: uuid
          readOnly: true
        site:
          type: string
          format: uuid
          readOnly: true
        building:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        zone_type:
          type: string
          maxLength: 40
        sop_reference:
          type: string
          maxLength: 240
        criticality:
          $ref: '#/components/schemas/CriticalityEnum'
        archived:
          type: boolean
      required:
      - building
      - id
      - name
      - organisation
      - site
      - zone_type
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    verifiedSession:
      type: apiKey
      in: cookie
      name: sessionid
